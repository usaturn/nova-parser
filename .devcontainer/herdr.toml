[keys]
prefix = "ctrl+k"

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [
    { token = "$git_clean",  fg = "#50FA7B" },
    { token = "$git_staged", fg = "#E5A700" },
    { token = "$git_dirty",  fg = "#FF5555" },
  ],
  [{ token = "$git_name" }],
  [{ token = "$clock", fg = "#8BE9FD" }],
]
